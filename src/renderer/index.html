<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>pet</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="stage">
      <div id="pet" data-state="idle">
        <div id="bubble" aria-hidden="true"></div>
        <div id="sprite"></div>
        <div id="leaf"></div>
        <div id="water"></div>
        <div id="bubbles"></div>
        <div id="hearts"></div>
      </div>
      <div id="leafTray" title="feed him"></div>
      <div id="leafGhost"></div>
    </div>
    <script type="module" src="pet.js"></script>
  </body>
</html>
